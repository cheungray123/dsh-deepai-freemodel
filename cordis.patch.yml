# dsh-deepai-freemodel — bundle patch：插入插件行（部署级）。
#
# 默认值无需改动：插件在进程内直连上游，不起子进程、不占端口。
# 首次使用要在「设置 → DeepAI Code」完成一次浏览器授权，之后 Key 落盘复用。
#
# 可选配置（config 里都可不填）：
#   providerId   默认 deepai
#   displayName  默认 "DeepAI Code"
#   dataDir      凭据与状态目录，默认 ~/.dsh-deepai-freemodel
#   apiOrigin    上游地址，默认 https://api.deepai.org
- insert:
    - id: deepai
      name: 'dsh-deepai-freemodel'
      config: {}
